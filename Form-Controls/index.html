<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Order Your Shirt 👕</h1>
    </header>
    <main>
      <form>
        <label for="name">Full Name </label>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required>

        <label for="email">Email </label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>

        <fieldset>
          <legend>What size t-shirt would you like?</legend>
          <label><input type="radio" name="size" value="small">XS</label>
          <label><input type="radio" name="size" value="small">S</label>
          <label><input type="radio" name="size" value="medium">M</label>
          <label><input type="radio" name="size" value="large">L</label>
          <label><input type="radio" name="size" value="large">XL</label>
          <label><input type="radio" name="size" value="large">XXL</label>
        </fieldset>
        <br>
        <fieldset>
          <legend>What color t-shirt would you like?</legend>
          <label><input type="radio" name="color" value="white"> Marshmallow White</label>
          <label><input type="radio" name="color" value="blue"> Deep Sea Blue</label>
          <label><input type="radio" name="color" value="green"> Lucky Clover Green</label>
          <label><input type="radio" name="color" value="black"> Midnight Black</label>
        
      </form>
    </main>
    <footer>
      <p> © 2026 Kimberly N. MigraCode | Class 1 Oct 2026 | Form Controls Assignment </p> 
    </footer>
  </body>
</html>
